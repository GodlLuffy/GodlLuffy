<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Outfit:wght@400;600;800;900&amp;display=swap');
      text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
    </style>

    <linearGradient id="connect-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#070c1a" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <linearGradient id="connect-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#14284b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="connect-halo-cyan" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="connect-halo-red" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="connect-dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#182c4d" opacity="0.45" />
    </pattern>

    <clipPath id="connect-rounded">
      <rect x="0" y="0" width="1200" height="520" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#connect-rounded)">
    <!-- Background -->
    <rect x="0" y="0" width="1200" height="520" fill="url(#connect-bg)" />
    <rect x="0" y="0" width="1200" height="520" fill="url(#connect-dots)" />
    <rect x="0" y="0" width="1200" height="520" fill="url(#connect-halo-cyan)" />
    <rect x="0" y="0" width="1200" height="520" fill="url(#connect-halo-red)" />

    <!-- TOP DIVIDER -->
    <path d="M40 70 L1160 70" stroke="#1b2e4b" stroke-width="1.5" />
    <text x="50" y="46" font-size="11" font-weight="700" fill="#7d95b7" class="mono" letter-spacing="2">05 // COMMUNICATIONS &amp; COLLABORATION NETWORK</text>
    <text x="1010" y="46" font-size="11" font-weight="700" fill="#00f0ff" class="mono" letter-spacing="1.5">[ SIGNALS OPEN ]</text>

    <!-- LEFT COLUMN: CALL TO ACTION -->
    <g transform="translate(60, 105)">
      <text x="0" y="32" font-size="44" font-weight="900" fill="#f0f5ff" letter-spacing="0.5">LET'S</text>
      <text x="0" y="78" font-size="44" font-weight="900" fill="#00f0ff" letter-spacing="0.5">CONNECT.</text>
      
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="350" height="175" rx="14" fill="#091424" stroke="#1d3b63" stroke-width="1.5" />
        
        <circle cx="34" cy="34" r="14" fill="#122744" stroke="#247bff" stroke-width="1.5" />
        <text x="28" y="39" font-size="13" font-weight="900" fill="#00f0ff">⚡</text>

        <text x="60" y="32" font-size="15" font-weight="800" fill="#f0f5ff">Have a bold vision?</text>
        <text x="60" y="48" font-size="10" font-weight="700" fill="#ff3366" class="mono">OPEN FOR NEW BUILDS</text>
        
        <text x="24" y="82" font-size="12" font-weight="400" fill="#88a5cc" class="mono">
          Have an ambitious 3D web experience,
        </text>
        <text x="24" y="102" font-size="12" font-weight="400" fill="#88a5cc" class="mono">
          Flutter mobile project, or creative
        </text>
        <text x="24" y="122" font-size="12" font-weight="400" fill="#88a5cc" class="mono">
          full-stack concept? Let's build together.
        </text>

        <line x1="24" y1="142" x2="326" y2="142" stroke="#142c4c" stroke-width="1" />
        <text x="24" y="160" font-size="10" font-weight="700" fill="#00f0ff" class="mono">
          STATUS: INBOX MONITORED DAILY
        </text>
      </g>
    </g>

    <!-- RIGHT COLUMN: CONNECTION CHANNEL CARDS -->
    <g transform="translate(470, 105)">
      <text x="0" y="24" font-size="28" font-weight="900" fill="#f0f5ff">BUILD SOMETHING GREAT.</text>
      <text x="0" y="44" font-size="11" font-weight="400" fill="#88a5cc" class="mono">DIRECT CHANNELS &amp; VERIFIED CONTACTS</text>

      <g transform="translate(0, 60)">
        <!-- Card 1: LinkedIn -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="670" height="60" rx="10" fill="#091424" stroke="#1c3a63" stroke-width="1.2" />
          
          <rect x="16" y="12" width="36" height="36" rx="6" fill="#0a66c2" />
          <text x="28" y="36" font-size="18" font-weight="900" fill="#ffffff" class="mono">in</text>

          <text x="68" y="28" font-size="15" font-weight="800" fill="#f0f5ff">LinkedIn</text>
          <text x="68" y="44" font-size="11" font-weight="600" fill="#7194bf" class="mono">linkedin.com/in/anup-gundelwar</text>

          <text x="630" y="36" font-size="18" fill="#247bff" font-weight="900">→</text>
          <line x1="0" y1="59" x2="100" y2="59" stroke="#0a66c2" stroke-width="2" />
        </g>

        <!-- Card 2: GitHub -->
        <g transform="translate(0, 72)">
          <rect x="0" y="0" width="670" height="60" rx="10" fill="#091424" stroke="#1c3a63" stroke-width="1.2" />
          
          <circle cx="34" cy="30" r="18" fill="#1b2e4b" />
          <text x="25" y="36" font-size="15" font-weight="900" fill="#00f0ff">GH</text>

          <text x="68" y="28" font-size="15" font-weight="800" fill="#f0f5ff">GitHub Profile</text>
          <text x="68" y="44" font-size="11" font-weight="600" fill="#7194bf" class="mono">github.com/GodlLuffy</text>

          <text x="630" y="36" font-size="18" fill="#00f0ff" font-weight="900">→</text>
          <line x1="0" y1="59" x2="100" y2="59" stroke="#00f0ff" stroke-width="2" />
        </g>

        <!-- Card 3: X / Twitter -->
        <g transform="translate(0, 144)">
          <rect x="0" y="0" width="670" height="60" rx="10" fill="#091424" stroke="#1c3a63" stroke-width="1.2" />
          
          <rect x="16" y="12" width="36" height="36" rx="6" fill="#142136" />
          <text x="29" y="36" font-size="16" font-weight="900" fill="#f0f5ff">𝕏</text>

          <text x="68" y="28" font-size="15" font-weight="800" fill="#f0f5ff">X (Twitter)</text>
          <text x="68" y="44" font-size="11" font-weight="600" fill="#7194bf" class="mono">twitter.com/GodlLuffy</text>

          <text x="630" y="36" font-size="18" fill="#ff3366" font-weight="900">→</text>
          <line x1="0" y1="59" x2="100" y2="59" stroke="#ff3366" stroke-width="2" />
        </g>

        <!-- Card 4: Email Direct -->
        <g transform="translate(0, 216)">
          <rect x="0" y="0" width="670" height="60" rx="10" fill="#091424" stroke="#1c3a63" stroke-width="1.2" />
          
          <rect x="16" y="12" width="36" height="36" rx="6" fill="#1d3b63" />
          <text x="27" y="35" font-size="14" font-weight="900" fill="#00f0ff">✉</text>

          <text x="68" y="28" font-size="15" font-weight="800" fill="#f0f5ff">Direct Email Inquiry</text>
          <text x="68" y="44" font-size="11" font-weight="600" fill="#7194bf" class="mono">gundelwaranup@gmail.com</text>

          <text x="630" y="36" font-size="18" fill="#00f0ff" font-weight="900">→</text>
          <line x1="0" y1="59" x2="100" y2="59" stroke="#247bff" stroke-width="2" />
        </g>
      </g>
    </g>

    <!-- BOTTOM PROGRESS LINE -->
    <path d="M40 470 L1160 470" stroke="#192d49" stroke-width="1" />
    <text x="50" y="496" font-size="11" font-weight="600" fill="#5c7a9f" class="mono">
      GOOD PEOPLE. CLEAN ARCHITECTURES. LET'S TALK.
    </text>
    <text x="980" y="496" font-size="11" font-weight="700" fill="#00f0ff" class="mono">
      OPEN_FOR_BUSINESS // 2026
    </text>

    <!-- Border Glow -->
    <rect x="1" y="1" width="1198" height="518" rx="19" fill="none" stroke="url(#connect-border)" stroke-width="2" />
  </g>
</svg>
