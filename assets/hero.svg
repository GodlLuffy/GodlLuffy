<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Outfit:wght@400;600;800;900&amp;display=swap');
      text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
      .pulse {
        animation: pulse-glow 2s infinite ease-in-out;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .cursor-blink {
        animation: blink 1s infinite steps(1);
      }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
    </style>

    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#070c1a" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#247bff" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#14284b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#247bff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-red" cx="15%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1b3258" opacity="0.4" />
    </pattern>

    <clipPath id="hero-rounded">
      <rect x="0" y="0" width="1200" height="640" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#hero-rounded)">
    <!-- Base Background -->
    <rect x="0" y="0" width="1200" height="640" fill="url(#hero-bg)" />
    <rect x="0" y="0" width="1200" height="640" fill="url(#dot-grid)" />
    <rect x="0" y="0" width="1200" height="640" fill="url(#glow-cyan)" />
    <rect x="0" y="0" width="1200" height="640" fill="url(#glow-red)" />

    <!-- Background Watermark -->
    <text x="500" y="520" font-size="200" font-weight="900" fill="#0c182e" opacity="0.25" letter-spacing="-5">GODL</text>

    <!-- TOP HUD BAR -->
    <path d="M40 70 L1160 70" stroke="#1b2e4b" stroke-width="1.5" />
    <text x="50" y="46" font-size="11" font-weight="700" fill="#7d95b7" class="mono" letter-spacing="2">GODLLUFFY // CREATIVE SOFTWARE ARCHITECT</text>
    <text x="520" y="46" font-size="11" font-weight="600" fill="#4d698e" class="mono" letter-spacing="1.5">SYS_ID: #198222047</text>
    <text x="760" y="46" font-size="11" font-weight="600" fill="#7d95b7" class="mono" letter-spacing="1.5">LOC: IN // GLOBAL</text>

    <!-- Top Right Chevrons -->
    <path d="M1100 35 L1110 35 L1104 50 L1094 50 Z" fill="#ff3366" />
    <path d="M1114 35 L1124 35 L1118 50 L1108 50 Z" fill="#ff3366" />
    <path d="M1128 35 L1138 35 L1132 50 L1122 50 Z" fill="#ff3366" />

    <!-- ==================== LEFT COLUMN: HERO IDENTITY ==================== -->
    <!-- Status Badge -->
    <g transform="translate(50, 100)">
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#0d1f36" stroke="#1f4474" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#00f0ff" class="pulse" />
      <text x="28" y="18" font-size="10" font-weight="700" fill="#d2e3f8" class="mono" letter-spacing="1.2">AVAILABLE TO BUILD</text>
    </g>

    <!-- Greeting Prompt -->
    <text x="50" y="165" font-size="15" font-weight="600" fill="#6c8bb3" class="mono">
      &gt; system.init(&quot;<tspan fill="#00f0ff">Anup Gundelwar</tspan>&quot;)
    </text>

    <!-- NAME SECTION (Completely separated, zero overlap) -->
    <text x="50" y="240" font-size="68" font-weight="900" fill="#f0f5ff" letter-spacing="0.5">ANUP</text>
    
    <!-- Cyber Slogan Badge (Cleanly placed to the right of ANUP, ample margin) -->
    <g transform="translate(260, 195)">
      <path d="M0 0 L8 0 L4 14 L-4 14 Z" fill="#ff3366" />
      <path d="M10 0 L18 0 L14 14 L6 14 Z" fill="#ff3366" />
      <path d="M20 0 L28 0 L24 14 L16 14 Z" fill="#ff3366" />
      <text x="0" y="32" font-size="20" font-weight="900" fill="#f0f5ff" letter-spacing="1">BUILD.</text>
      <text x="0" y="52" font-size="20" font-weight="900" fill="#00f0ff" letter-spacing="1">BEYOND.</text>
    </g>

    <text x="50" y="318" font-size="68" font-weight="900" fill="url(#cyber-cyan)" letter-spacing="0.5">GUNDELWAR</text>

    <!-- DYNAMIC ROLE CAROUSEL (Clean row at y=355) -->
    <g transform="translate(50, 355)">
      <!-- Role 1 -->
      <g opacity="1">
        <animate attributeName="opacity" begin="0s" dur="16s" values="1;1;0;0;1" keyTimes="0;0.22;0.25;0.97;1" repeatCount="indefinite" />
        <rect x="0" y="0" width="480" height="36" rx="6" fill="#0b172a" stroke="#1c3a63" stroke-width="1" />
        <text x="14" y="24" font-size="17" font-weight="700" fill="#f0f5ff">⚡ Creative Frontend &amp; 3D Developer</text>
      </g>
      <!-- Role 2 -->
      <g opacity="0">
        <animate attributeName="opacity" begin="0s" dur="16s" values="0;0;1;1;0;0" keyTimes="0;0.22;0.25;0.47;0.5;1" repeatCount="indefinite" />
        <rect x="0" y="0" width="480" height="36" rx="6" fill="#0b172a" stroke="#1c3a63" stroke-width="1" />
        <text x="14" y="24" font-size="17" font-weight="700" fill="#f0f5ff">🚀 Full-Stack Web &amp; App Architect</text>
      </g>
      <!-- Role 3 -->
      <g opacity="0">
        <animate attributeName="opacity" begin="0s" dur="16s" values="0;0;1;1;0;0" keyTimes="0;0.47;0.5;0.72;0.75;1" repeatCount="indefinite" />
        <rect x="0" y="0" width="480" height="36" rx="6" fill="#0b172a" stroke="#1c3a63" stroke-width="1" />
        <text x="14" y="24" font-size="17" font-weight="700" fill="#f0f5ff">📱 Cross-Platform Mobile Engineer (Flutter)</text>
      </g>
      <!-- Role 4 -->
      <g opacity="0">
        <animate attributeName="opacity" begin="0s" dur="16s" values="0;0;1;1;0" keyTimes="0;0.72;0.75;0.97;1" repeatCount="indefinite" />
        <rect x="0" y="0" width="480" height="36" rx="6" fill="#0b172a" stroke="#1c3a63" stroke-width="1" />
        <text x="14" y="24" font-size="17" font-weight="700" fill="#f0f5ff">✨ UI/UX &amp; 60FPS Micro-Animations Crafter</text>
      </g>
    </g>

    <!-- Bio Statement (Separate lines, zero collision) -->
    <text x="50" y="435" font-size="13" font-weight="400" fill="#9db6d8" class="mono">
      Building silky 3D interfaces, high-octane web apps, and
    </text>
    <text x="50" y="458" font-size="13" font-weight="400" fill="#9db6d8" class="mono">
      cross-platform mobile experiences with uncompromising detail.
    </text>

    <!-- ==================== RIGHT COLUMN: SLEEK CYBER CODE CONSOLE ==================== -->
    <g transform="translate(680, 105)">
      <!-- Console Frame -->
      <rect x="0" y="0" width="460" height="400" rx="14" fill="#08101e" stroke="url(#card-border)" stroke-width="1.8" />
      
      <!-- Top Titlebar -->
      <rect x="0" y="0" width="460" height="38" rx="14" fill="#0d1b32" />
      <circle cx="22" cy="19" r="5" fill="#ff3366" />
      <circle cx="38" cy="19" r="5" fill="#f5a623" />
      <circle cx="54" cy="19" r="5" fill="#00f0ff" />
      
      <text x="76" y="23" font-size="11" font-weight="700" fill="#7194bf" class="mono">DEV_CONSOLE // GODLLUFFY.TS</text>
      <text x="420" y="23" font-size="10" font-weight="700" fill="#00f0ff" class="mono">READY</text>

      <!-- Code Block Body -->
      <g transform="translate(24, 60)">
        <text x="0" y="18" font-size="12" fill="#5c7a9f" class="mono">01</text>
        <text x="32" y="18" font-size="12" fill="#ff3366" class="mono">const</text>
        <text x="75" y="18" font-size="12" fill="#00f0ff" class="mono">architect</text>
        <text x="145" y="18" font-size="12" fill="#f0f5ff" class="mono">= {</text>

        <text x="0" y="44" font-size="12" fill="#5c7a9f" class="mono">02</text>
        <text x="32" y="44" font-size="12" fill="#7d9ec4" class="mono">  name:</text>
        <text x="95" y="44" font-size="12" fill="#88d49e" class="mono">&quot;Anup Gundelwar&quot;</text>
        <text x="215" y="44" font-size="12" fill="#f0f5ff" class="mono">,</text>

        <text x="0" y="70" font-size="12" fill="#5c7a9f" class="mono">03</text>
        <text x="32" y="70" font-size="12" fill="#7d9ec4" class="mono">  alias:</text>
        <text x="95" y="70" font-size="12" fill="#88d49e" class="mono">&quot;@GodlLuffy&quot;</text>
        <text x="180" y="70" font-size="12" fill="#f0f5ff" class="mono">,</text>

        <text x="0" y="96" font-size="12" fill="#5c7a9f" class="mono">04</text>
        <text x="32" y="96" font-size="12" fill="#7d9ec4" class="mono">  core:</text>
        <text x="85" y="96" font-size="12" fill="#f0f5ff" class="mono">[</text>
        <text x="95" y="96" font-size="12" fill="#247bff" class="mono">&quot;3D WebGL&quot;</text>
        <text x="175" y="96" font-size="12" fill="#f0f5ff" class="mono">, </text>
        <text x="190" y="96" font-size="12" fill="#54c5f8" class="mono">&quot;Flutter&quot;</text>
        <text x="255" y="96" font-size="12" fill="#f0f5ff" class="mono">, </text>
        <text x="270" y="96" font-size="12" fill="#00f0ff" class="mono">&quot;React&quot;</text>
        <text x="325" y="96" font-size="12" fill="#f0f5ff" class="mono">],</text>

        <text x="0" y="122" font-size="12" fill="#5c7a9f" class="mono">05</text>
        <text x="32" y="122" font-size="12" fill="#7d9ec4" class="mono">  focus:</text>
        <text x="95" y="122" font-size="12" fill="#88d49e" class="mono">&quot;60FPS Micro-Animations&quot;</text>
        <text x="285" y="122" font-size="12" fill="#f0f5ff" class="mono">,</text>

        <text x="0" y="148" font-size="12" fill="#5c7a9f" class="mono">06</text>
        <text x="32" y="148" font-size="12" fill="#7d9ec4" class="mono">  repos:</text>
        <text x="95" y="148" font-size="12" fill="#f5a623" class="mono">10</text>
        <text x="115" y="148" font-size="12" fill="#7d9ec4" class="mono">+ active projects</text>
        <text x="245" y="148" font-size="12" fill="#f0f5ff" class="mono">,</text>

        <text x="0" y="174" font-size="12" fill="#5c7a9f" class="mono">07</text>
        <text x="32" y="174" font-size="12" fill="#7d9ec4" class="mono">  status:</text>
        <text x="95" y="174" font-size="12" fill="#88d49e" class="mono">&quot;Open to Collaborations&quot;</text>

        <text x="0" y="200" font-size="12" fill="#5c7a9f" class="mono">08</text>
        <text x="32" y="200" font-size="12" fill="#f0f5ff" class="mono">};</text>

        <text x="0" y="235" font-size="12" fill="#5c7a9f" class="mono">09</text>
        <text x="32" y="235" font-size="12" fill="#00f0ff" class="mono">architect</text>
        <text x="102" y="235" font-size="12" fill="#f0f5ff" class="mono">.</text>
        <text x="110" y="235" font-size="12" fill="#ffd43b" class="mono">buildNextGeneration</text>
        <text x="250" y="235" font-size="12" fill="#f0f5ff" class="mono">();</text>
        <rect x="270" y="222" width="8" height="14" fill="#00f0ff" class="cursor-blink" />
      </g>

      <!-- Bottom Mini Status -->
      <rect x="18" y="325" width="424" height="52" rx="8" fill="#0b162a" stroke="#1a355c" stroke-width="1" />
      <circle cx="36" cy="351" r="5" fill="#00f0ff" />
      <text x="50" y="347" font-size="11" font-weight="700" fill="#f0f5ff">TERMINAL OUTPUT: READY</text>
      <text x="50" y="363" font-size="10" font-weight="500" fill="#688ab5" class="mono">Compiled without errors · 60FPS render loop</text>
    </g>

    <!-- ==================== BOTTOM HUD STATUS BAR ==================== -->
    <path d="M40 550 L1160 550" stroke="#192d49" stroke-width="1.5" />

    <!-- Stat Pills with Ample Spacing -->
    <g transform="translate(50, 574)">
      <circle cx="6" cy="10" r="4" fill="#247bff" />
      <text x="18" y="14" font-size="11" font-weight="600" fill="#9db6d8" class="mono">INDIA</text>

      <g transform="translate(120, 0)">
        <rect x="0" y="-3" width="95" height="24" rx="4" fill="#0d1b32" stroke="#1c3a63" stroke-width="1" />
        <text x="10" y="13" font-size="10" font-weight="700" fill="#00f0ff" class="mono">10+ REPOSITORIES</text>
      </g>

      <g transform="translate(235, 0)">
        <rect x="0" y="-3" width="130" height="24" rx="4" fill="#0d1b32" stroke="#1c3a63" stroke-width="1" />
        <text x="10" y="13" font-size="10" font-weight="700" fill="#7db5ff" class="mono">JS / FLUTTER / 3D</text>
      </g>

      <g transform="translate(385, 0)">
        <text x="0" y="14" font-size="11" font-weight="600" fill="#ff3366" class="mono">&gt; SPECIALIZING IN 60FPS UI INTERACTION</text>
      </g>

      <g transform="translate(930, 0)">
        <text x="0" y="14" font-size="11" font-weight="700" fill="#527096" class="mono" letter-spacing="1">PROFILE V4.3</text>
      </g>
    </g>

    <!-- Outer Border Glow -->
    <rect x="1" y="1" width="1198" height="638" rx="19" fill="none" stroke="url(#card-border)" stroke-width="2" />
  </g>
</svg>
