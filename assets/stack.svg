<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Outfit:wght@400;600;800;900&amp;display=swap');
      text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
      .tech-card {
        transition: transform 0.2s ease;
      }
    </style>

    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#070c1a" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#14284b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#247bff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="stack-dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#182c4d" opacity="0.45" />
    </pattern>

    <clipPath id="stack-rounded">
      <rect x="0" y="0" width="1200" height="660" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#stack-rounded)">
    <!-- Background -->
    <rect x="0" y="0" width="1200" height="660" fill="url(#stack-bg)" />
    <rect x="0" y="0" width="1200" height="660" fill="url(#stack-dots)" />

    <!-- TOP HUD LINE -->
    <path d="M40 70 L1160 70" stroke="#1b2e4b" stroke-width="1.5" />
    <text x="44" y="46" font-size="11" font-weight="700" fill="#7d95b7" class="mono" letter-spacing="2">03 // ARSENAL &amp; TECHNICAL ARTIFACTS</text>
    <text x="1010" y="46" font-size="11" font-weight="700" fill="#00f0ff" class="mono" letter-spacing="1.5">[ RADAR ACTIVE ]</text>

    <!-- LEFT COLUMN: TITLE & ORBITAL CONSTELLATION GRAPH -->
    <g transform="translate(44, 90)">
      <text x="0" y="32" font-size="34" font-weight="900" fill="#f0f5ff" letter-spacing="0.5">TOOLS CHANGE.</text>
      <text x="0" y="70" font-size="34" font-weight="900" fill="#00f0ff" letter-spacing="0.5">CURIOSITY DOESN'T.</text>
      <text x="0" y="98" font-size="13" font-weight="400" fill="#88a5cc" class="mono">Full-stack, real-time, cross-platform and 3D toolchain.</text>

      <!-- ORBITAL PLANETARY HUB GRAPH -->
      <g transform="translate(250, 310)">
        <!-- Radial glow -->
        <circle cx="0" cy="0" r="180" fill="url(#hub-glow)" />

        <!-- Orbit 1 (Inner) -->
        <circle cx="0" cy="0" r="90" fill="none" stroke="#247bff" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
        
        <!-- Orbit 2 (Outer) -->
        <circle cx="0" cy="0" r="160" fill="none" stroke="#1c3a63" stroke-width="1.5" stroke-dasharray="10 14" opacity="0.6" />

        <!-- Rotating Outer Orbit Line with Animated Dashes -->
        <circle cx="0" cy="0" r="160" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="40 280" opacity="0.6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite" />
        </circle>

        <!-- Connecting Constellation Lines -->
        <line x1="0" y1="0" x2="-80" y2="-60" stroke="#1d3b63" stroke-width="1.5" />
        <line x1="0" y1="0" x2="80" y2="-60" stroke="#1d3b63" stroke-width="1.5" />
        <line x1="0" y1="0" x2="-140" y2="40" stroke="#1d3b63" stroke-width="1.5" />
        <line x1="0" y1="0" x2="130" y2="60" stroke="#1d3b63" stroke-width="1.5" />
        <line x1="0" y1="0" x2="0" y2="155" stroke="#1d3b63" stroke-width="1.5" />
        <line x1="0" y1="0" x2="0" y2="-155" stroke="#1d3b63" stroke-width="1.5" />

        <!-- Central Hub Node -->
        <circle cx="0" cy="0" r="42" fill="#0b172a" stroke="#00f0ff" stroke-width="2" />
        <circle cx="0" cy="0" r="34" fill="#122543" />
        <text x="0" y="6" font-size="16" font-weight="900" fill="#f0f5ff" text-anchor="middle" class="mono">CORE</text>

        <!-- Satellite 1: JS (Inner Left Top) -->
        <g transform="translate(-80, -60)">
          <circle cx="0" cy="0" r="22" fill="#0d1b30" stroke="#f7df1e" stroke-width="1.5" />
          <text x="0" y="5" font-size="12" font-weight="800" fill="#f7df1e" text-anchor="middle" class="mono">JS</text>
        </g>

        <!-- Satellite 2: TS (Inner Right Top) -->
        <g transform="translate(80, -60)">
          <circle cx="0" cy="0" r="22" fill="#0d1b30" stroke="#3178c6" stroke-width="1.5" />
          <text x="0" y="5" font-size="12" font-weight="800" fill="#3178c6" text-anchor="middle" class="mono">TS</text>
        </g>

        <!-- Satellite 3: React (Outer Left) -->
        <g transform="translate(-140, 40)">
          <circle cx="0" cy="0" r="24" fill="#0d1b30" stroke="#61dafb" stroke-width="1.5" />
          <text x="0" y="5" font-size="11" font-weight="800" fill="#61dafb" text-anchor="middle" class="mono">React</text>
        </g>

        <!-- Satellite 4: Flutter (Outer Right) -->
        <g transform="translate(130, 60)">
          <circle cx="0" cy="0" r="24" fill="#0d1b30" stroke="#02569b" stroke-width="1.5" />
          <text x="0" y="5" font-size="11" font-weight="800" fill="#54c5f8" text-anchor="middle" class="mono">Flutter</text>
        </g>

        <!-- Satellite 5: Three.js (Outer Top) -->
        <g transform="translate(0, -155)">
          <circle cx="0" cy="0" r="24" fill="#0d1b30" stroke="#ff3366" stroke-width="1.5" />
          <text x="0" y="5" font-size="11" font-weight="800" fill="#ff3366" text-anchor="middle" class="mono">3D</text>
        </g>

        <!-- Satellite 6: Node.js (Outer Bottom) -->
        <g transform="translate(0, 155)">
          <circle cx="0" cy="0" r="24" fill="#0d1b30" stroke="#339933" stroke-width="1.5" />
          <text x="0" y="5" font-size="11" font-weight="800" fill="#68a063" text-anchor="middle" class="mono">Node</text>
        </g>
      </g>
    </g>

    <!-- RIGHT COLUMN: CATEGORIZED TECH STACK CARDS -->
    <g transform="translate(590, 90)">
      
      <!-- CATEGORY 1: CORE LANGUAGES -->
      <text x="0" y="24" font-size="11" font-weight="700" fill="#7d95b7" class="mono" letter-spacing="1.6">01 // CORE LANGUAGES</text>
      
      <g transform="translate(0, 36)">
        <!-- JavaScript -->
        <rect x="0" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <rect x="12" y="12" width="22" height="22" rx="4" fill="#f7df1e" />
        <text x="17" y="28" font-size="12" font-weight="900" fill="#000000" class="mono">JS</text>
        <text x="14" y="52" font-size="13" font-weight="800" fill="#f0f5ff">JavaScript</text>
        <line x1="0" y1="65" x2="60" y2="65" stroke="#f7df1e" stroke-width="2" />

        <!-- TypeScript -->
        <rect x="145" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <rect x="157" y="12" width="22" height="22" rx="4" fill="#3178c6" />
        <text x="162" y="28" font-size="12" font-weight="900" fill="#ffffff" class="mono">TS</text>
        <text x="159" y="52" font-size="13" font-weight="800" fill="#f0f5ff">TypeScript</text>
        <line x1="145" y1="65" x2="205" y2="65" stroke="#3178c6" stroke-width="2" />

        <!-- Dart -->
        <rect x="290" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <rect x="302" y="12" width="22" height="22" rx="4" fill="#0175c2" />
        <text x="307" y="28" font-size="12" font-weight="900" fill="#ffffff" class="mono">D</text>
        <text x="304" y="52" font-size="13" font-weight="800" fill="#f0f5ff">Dart</text>
        <line x1="290" y1="65" x2="350" y2="65" stroke="#0175c2" stroke-width="2" />

        <!-- Python -->
        <rect x="435" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <rect x="447" y="12" width="22" height="22" rx="4" fill="#3776ab" />
        <text x="452" y="28" font-size="12" font-weight="900" fill="#ffd43b" class="mono">Py</text>
        <text x="449" y="52" font-size="13" font-weight="800" fill="#f0f5ff">Python</text>
        <line x1="435" y1="65" x2="495" y2="65" stroke="#3776ab" stroke-width="2" />
      </g>

      <!-- CATEGORY 2: FRONTEND & 3D INTERACTION -->
      <text x="0" y="146" font-size="11" font-weight="700" fill="#7d95b7" class="mono" letter-spacing="1.6">02 // FRONTEND &amp; 3D CREATIVE</text>
      
      <g transform="translate(0, 158)">
        <!-- React -->
        <rect x="0" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <circle cx="23" cy="23" r="10" fill="none" stroke="#61dafb" stroke-width="1.5" />
        <circle cx="23" cy="23" r="3" fill="#61dafb" />
        <text x="14" y="52" font-size="13" font-weight="800" fill="#f0f5ff">React.js</text>
        <line x1="0" y1="65" x2="60" y2="65" stroke="#247bff" stroke-width="2" />

        <!-- Next.js -->
        <rect x="145" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <circle cx="168" cy="23" r="10" fill="#ffffff" />
        <text x="163" y="28" font-size="12" font-weight="900" fill="#000000" class="mono">N</text>
        <text x="159" y="52" font-size="13" font-weight="800" fill="#f0f5ff">Next.js</text>
        <line x1="145" y1="65" x2="205" y2="65" stroke="#247bff" stroke-width="2" />

        <!-- Three.js -->
        <rect x="290" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <polygon points="313,13 323,31 303,31" fill="#ff3366" />
        <text x="304" y="52" font-size="13" font-weight="800" fill="#f0f5ff">Three.js</text>
        <line x1="290" y1="65" x2="350" y2="65" stroke="#ff3366" stroke-width="2" />

        <!-- Tailwind CSS -->
        <rect x="435" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <path d="M 447 25 Q 452 17 457 23 Q 462 29 467 21" stroke="#38bdf8" stroke-width="2" fill="none" />
        <text x="449" y="52" font-size="13" font-weight="800" fill="#f0f5ff">Tailwind</text>
        <line x1="435" y1="65" x2="495" y2="65" stroke="#38bdf8" stroke-width="2" />
      </g>

      <!-- CATEGORY 3: BACKEND, MOBILE & DEVOPS -->
      <text x="0" y="268" font-size="11" font-weight="700" fill="#7d95b7" class="mono" letter-spacing="1.6">03 // BACKEND, MOBILE &amp; TOOLS</text>
      
      <g transform="translate(0, 280)">
        <!-- Node.js -->
        <rect x="0" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <polygon points="23,13 32,18 32,28 23,33 14,28 14,18" fill="none" stroke="#68a063" stroke-width="1.5" />
        <text x="14" y="52" font-size="13" font-weight="800" fill="#f0f5ff">Node.js</text>
        <line x1="0" y1="65" x2="60" y2="65" stroke="#68a063" stroke-width="2" />

        <!-- Flutter -->
        <rect x="145" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <polygon points="172,13 162,23 172,33 166,33 158,25 166,17" fill="#54c5f8" />
        <text x="159" y="52" font-size="13" font-weight="800" fill="#f0f5ff">Flutter</text>
        <line x1="145" y1="65" x2="205" y2="65" stroke="#54c5f8" stroke-width="2" />

        <!-- Git & GitHub -->
        <rect x="290" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <circle cx="313" cy="23" r="8" fill="none" stroke="#f05032" stroke-width="1.5" />
        <line x1="313" y1="15" x2="313" y2="31" stroke="#f05032" stroke-width="1.5" />
        <text x="304" y="52" font-size="13" font-weight="800" fill="#f0f5ff">Git / GitHub</text>
        <line x1="290" y1="65" x2="350" y2="65" stroke="#f05032" stroke-width="2" />

        <!-- REST & Cloud APIs -->
        <rect x="435" y="0" width="130" height="66" rx="8" fill="#0a1424" stroke="#1d385f" stroke-width="1.2" />
        <rect x="447" y="16" width="22" height="14" rx="3" fill="none" stroke="#00f0ff" stroke-width="1.5" />
        <text x="449" y="52" font-size="13" font-weight="800" fill="#f0f5ff">REST APIs</text>
        <line x1="435" y1="65" x2="495" y2="65" stroke="#00f0ff" stroke-width="2" />
      </g>

      <!-- Bottom Tagline -->
      <g transform="translate(0, 395)">
        <rect x="0" y="0" width="565" height="42" rx="8" fill="#08101e" stroke="#183256" stroke-width="1" />
        <text x="20" y="26" font-size="12" font-weight="700" fill="#7d95b7" class="mono" letter-spacing="2">
          CRAFT // ARCHITECT // ANIMATE // DEPLOY
        </text>
        <circle cx="535" cy="21" r="5" fill="#00f0ff" />
      </g>
    </g>

    <!-- Bottom border line -->
    <path d="M40 590 L1160 590" stroke="#192d49" stroke-width="1" />
    <text x="44" y="620" font-size="11" font-weight="600" fill="#5c7a9f" class="mono">
      FULL-STACK CAPABILITY MATRIX · CONTINUOUS EXPERIMENTATION
    </text>
    <text x="1035" y="620" font-size="11" font-weight="700" fill="#ff3366" class="mono">SYSTEM_STABLE</text>

    <!-- Container border -->
    <rect x="1" y="1" width="1198" height="658" rx="19" fill="none" stroke="url(#border-glow)" stroke-width="2" />
  </g>
</svg>
