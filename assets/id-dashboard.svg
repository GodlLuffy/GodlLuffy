      <!-- Status Card: CURRENT FOCUS -->
      <g transform="translate(0, 470)">
        <rect x="0" y="0" width="598" height="120" rx="12" fill="#0a172a" stroke="#224675" stroke-width="1.5" />
        
        <rect x="20" y="20" width="60" height="24" rx="4" fill="#ff3366" />
        <text x="32" y="36" font-size="10" font-weight="900" fill="#ffffff" class="mono" letter-spacing="1">NOW</text>

        <text x="94" y="36" font-size="15" font-weight="800" fill="#f0f5ff">Building next-gen 3D web apps &amp; Flutter products</text>
        
        <text x="20" y="72" font-size="13" font-weight="400" fill="#88a5cc" class="mono">
          Exploring Three.js shader pipelines and high-scalability full-stack systems.
        </text>
        
        <circle cx="26" cy="98" r="4" fill="#00f0ff" />
        <text x="38" y="102" font-size="11" font-weight="700" fill="#00f0ff" class="mono">
