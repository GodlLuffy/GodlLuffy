<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Outfit:wght@400;600;800;900&amp;display=swap');
      text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
      }
    </style>

    <linearGradient id="dash-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#070c1a" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <linearGradient id="dash-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#14284b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3" />
    </linearGradient>

    <!-- Holographic Badge Foil Gradient -->
    <linearGradient id="foil-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="45%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#ff3366" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#247bff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="dash-halo" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="dash-dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#182c4d" opacity="0.45" />
    </pattern>

    <clipPath id="dash-rounded">
      <rect x="0" y="0" width="1200" height="780" rx="20" />
    </clipPath>

    <clipPath id="badge-clip">
      <rect x="0" y="0" width="340" height="490" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#dash-rounded)">
    <!-- Base Background -->
    <rect x="0" y="0" width="1200" height="780" fill="url(#dash-bg)" />
    <rect x="0" y="0" width="1200" height="780" fill="url(#dash-dots)" />
    <rect x="0" y="0" width="1200" height="780" fill="url(#dash-halo)" />

    <!-- TOP HEADER LINE -->
    <path d="M40 70 L1160 70" stroke="#1b2e4b" stroke-width="1.5" />
    <text x="44" y="46" font-size="11" font-weight="700" fill="#7d95b7" class="mono" letter-spacing="2">04 // METRICS &amp; IDENTITY DASHBOARD</text>
    <text x="980" y="46" font-size="11" font-weight="700" fill="#ff3366" class="mono" letter-spacing="1.5">[ VERIFIED DEVELOPER ]</text>

    <!-- ==================== LEFT COLUMN: HANGING CYBER ID BADGE ==================== -->
    <g transform="translate(60, 90)">
      <text x="0" y="32" font-size="34" font-weight="900" fill="#f0f5ff" letter-spacing="0.5">THE BUILDER.</text>
      <text x="0" y="58" font-size="13" font-weight="400" fill="#88a5cc" class="mono">BEHIND THE CODE &amp; ARCHITECTURE.</text>

      <!-- PENDULUM SWING CONTAINER -->
      <g transform="translate(40, 80)">
        <animateTransform attributeName="transform" type="rotate"
          values="-1.5 210 0; 1.5 210 0; -1.5 210 0"
          dur="7s" repeatCount="indefinite" ease="ease-in-out" />

        <!-- Lanyard Strap (Top) -->
        <rect x="185" y="-30" width="50" height="70" fill="#14284b" stroke="#247bff" stroke-width="1.5" />
        <line x1="200" y1="-30" x2="200" y2="40" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" />
        <line x1="220" y1="-30" x2="220" y2="40" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" />

        <!-- Metallic Chrome Clip -->
        <rect x="195" y="35" width="30" height="28" rx="4" fill="#2d4870" stroke="#7bb0f5" stroke-width="1.5" />
        <circle cx="210" cy="49" r="5" fill="#0d1b32" stroke="#7bb0f5" stroke-width="1.2" />

        <!-- Lanyard Hole Slot on Card -->
        <rect x="180" y="56" width="60" height="12" rx="6" fill="#050913" stroke="#247bff" stroke-width="1" />

        <!-- ID BADGE CARD BODY -->
        <g transform="translate(40, 50)" clip-path="url(#badge-clip)">
          <!-- Card Surface -->
          <rect x="0" y="0" width="340" height="490" rx="16" fill="#091322" stroke="#247bff" stroke-width="2" />

          <!-- Card Top Bar -->
          <rect x="0" y="0" width="340" height="60" fill="#0d1f38" />
          <text x="20" y="38" font-size="11" font-weight="800" fill="#00f0ff" class="mono" letter-spacing="2">ACCESS // DEV-PASS</text>
          <text x="240" y="38" font-size="11" font-weight="700" fill="#ff3366" class="mono">SEC_01</text>

          <!-- Developer Avatar Frame -->
          <g transform="translate(24, 75)">
            <rect x="0" y="0" width="292" height="190" rx="10" fill="#050a14" stroke="#1c3b63" stroke-width="1.5" />
            <image href="https://avatars.githubusercontent.com/u/198222047?v=4" x="4" y="4" width="284" height="182" preserveAspectRatio="xMidYMid slice" opacity="0.9" rx="8" />
            <rect x="4" y="4" width="284" height="182" rx="8" fill="url(#dash-dots)" opacity="0.3" />
            
            <!-- Cyber corner brackets -->
            <path d="M 12 28 L 12 12 L 28 12" stroke="#00f0ff" stroke-width="2" fill="none" />
            <path d="M 280 28 L 280 12 L 264 12" stroke="#00f0ff" stroke-width="2" fill="none" />
            <path d="M 12 166 L 12 182 L 28 182" stroke="#00f0ff" stroke-width="2" fill="none" />
            <path d="M 280 166 L 280 182 L 264 182" stroke="#00f0ff" stroke-width="2" fill="none" />
          </g>

          <!-- Smart Chip Gold Icon -->
          <g transform="translate(24, 280)">
            <rect x="0" y="0" width="46" height="36" rx="6" fill="#d4af37" stroke="#997a15" stroke-width="1" />
            <line x1="0" y1="18" x2="46" y2="18" stroke="#8a6d10" stroke-width="1" />
            <line x1="23" y1="0" x2="23" y2="36" stroke="#8a6d10" stroke-width="1" />
            <rect x="14" y="10" width="18" height="16" rx="2" fill="none" stroke="#8a6d10" stroke-width="1" />
          </g>

          <!-- Card Details -->
          <g transform="translate(85, 276)">
            <text x="0" y="20" font-size="18" font-weight="900" fill="#f0f5ff">ANUP GUNDELWAR</text>
            <text x="0" y="38" font-size="12" font-weight="700" fill="#00f0ff" class="mono">CREATIVE FULL-STACK ENG</text>
          </g>

          <!-- Divider -->
          <line x1="24" y1="334" x2="316" y2="334" stroke="#1b3456" stroke-width="1" />

          <!-- Details Table -->
          <g transform="translate(24, 342)">
            <text x="0" y="18" font-size="10" font-weight="600" fill="#6c8eb5" class="mono">GITHUB ID</text>
            <text x="0" y="34" font-size="13" font-weight="800" fill="#f0f5ff" class="mono">GodlLuffy</text>

            <text x="140" y="18" font-size="10" font-weight="600" fill="#6c8eb5" class="mono">ROLE</text>
            <text x="140" y="34" font-size="13" font-weight="800" fill="#ff3366" class="mono">ARCHITECT</text>

            <text x="230" y="18" font-size="10" font-weight="600" fill="#6c8eb5" class="mono">STATUS</text>
            <text x="230" y="34" font-size="13" font-weight="800" fill="#00f0ff" class="mono">ACTIVE</text>
          </g>

          <!-- Barcode Generation -->
          <g transform="translate(24, 400)">
            <!-- Barcode lines -->
            <rect x="0" y="0" width="3" height="35" fill="#88a9d3" />
            <rect x="6" y="0" width="1.5" height="35" fill="#88a9d3" />
            <rect x="11" y="0" width="4" height="35" fill="#88a9d3" />
            <rect x="18" y="0" width="1.5" height="35" fill="#88a9d3" />
            <rect x="23" y="0" width="5" height="35" fill="#88a9d3" />
            <rect x="32" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="38" y="0" width="4" height="35" fill="#88a9d3" />
            <rect x="46" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="52" y="0" width="1.5" height="35" fill="#88a9d3" />
            <rect x="57" y="0" width="5" height="35" fill="#88a9d3" />
            <rect x="66" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="72" y="0" width="3" height="35" fill="#88a9d3" />
            <rect x="79" y="0" width="1.5" height="35" fill="#88a9d3" />
            <rect x="84" y="0" width="4.5" height="35" fill="#88a9d3" />
            <rect x="92" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="98" y="0" width="1.5" height="35" fill="#88a9d3" />
            <rect x="103" y="0" width="5" height="35" fill="#88a9d3" />
            <rect x="112" y="0" width="3" height="35" fill="#88a9d3" />
            <rect x="119" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="125" y="0" width="4" height="35" fill="#88a9d3" />
            <rect x="133" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="139" y="0" width="5" height="35" fill="#88a9d3" />
            <rect x="148" y="0" width="1.5" height="35" fill="#88a9d3" />
            <rect x="153" y="0" width="3" height="35" fill="#88a9d3" />
            <rect x="160" y="0" width="4" height="35" fill="#88a9d3" />
            <rect x="168" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="174" y="0" width="5" height="35" fill="#88a9d3" />
            <rect x="183" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="189" y="0" width="3" height="35" fill="#88a9d3" />
            <rect x="196" y="0" width="1.5" height="35" fill="#88a9d3" />
            <rect x="201" y="0" width="4" height="35" fill="#88a9d3" />
            <rect x="209" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="215" y="0" width="5" height="35" fill="#88a9d3" />
            <rect x="224" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="230" y="0" width="3" height="35" fill="#88a9d3" />
            <rect x="237" y="0" width="1.5" height="35" fill="#88a9d3" />
            <rect x="242" y="0" width="4" height="35" fill="#88a9d3" />
            <rect x="250" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="256" y="0" width="5" height="35" fill="#88a9d3" />
            <rect x="265" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="271" y="0" width="3" height="35" fill="#88a9d3" />
            <rect x="278" y="0" width="2" height="35" fill="#88a9d3" />
            <rect x="284" y="0" width="4" height="35" fill="#88a9d3" />

            <text x="0" y="52" font-size="9" font-weight="600" fill="#6c8eb5" class="mono">
              AUTH_HASH: 0x98222047_GODL_SYS
            </text>
          </g>

          <!-- Holographic Light Sweep Across Badge -->
          <rect x="-400" y="0" width="280" height="490" fill="url(#foil-shine)" transform="skewX(-20)">
            <animate attributeName="x" begin="0s" dur="8s" values="-400;650" repeatCount="indefinite" />
          </rect>
        </g>
      </g>
    </g>

    <!-- ==================== RIGHT COLUMN: REAL WORK, REAL IMPACT METRICS ==================== -->
    <g transform="translate(540, 90)">
      <text x="0" y="32" font-size="34" font-weight="900" fill="#f0f5ff" letter-spacing="0.5">REAL WORK. REAL IMPACT.</text>
      <text x="0" y="58" font-size="13" font-weight="400" fill="#88a5cc" class="mono">PUBLIC GITHUB STATS &amp; REPOSITORY INTELLIGENCE</text>

      <!-- 3 Top Metric Counter Cards -->
      <g transform="translate(0, 80)">
        <!-- Card 1: Public Repos -->
        <rect x="0" y="0" width="186" height="110" rx="10" fill="#0b172a" stroke="#1d3b63" stroke-width="1.2" />
        <text x="20" y="28" font-size="10" font-weight="700" fill="#7194bf" class="mono">PUBLIC REPOS</text>
        <text x="20" y="74" font-size="44" font-weight="900" fill="#00f0ff">10+</text>
        <text x="20" y="94" font-size="10" font-weight="600" fill="#4d6f99" class="mono">ACTIVE &amp; EXPANDING</text>

        <!-- Card 2: Languages -->
        <rect x="206" y="0" width="186" height="110" rx="10" fill="#0b172a" stroke="#1d3b63" stroke-width="1.2" />
        <text x="20" y="28" font-size="10" font-weight="700" fill="#7194bf" class="mono" transform="translate(206,0)">CORE DOMAINS</text>
        <text x="20" y="74" font-size="44" font-weight="900" fill="#247bff" transform="translate(206,0)">4</text>
        <text x="20" y="94" font-size="10" font-weight="600" fill="#4d6f99" class="mono" transform="translate(206,0)">WEB, 3D, MOBILE, APIS</text>

        <!-- Card 3: Code Velocity -->
        <rect x="412" y="0" width="186" height="110" rx="10" fill="#0b172a" stroke="#1d3b63" stroke-width="1.2" />
        <text x="20" y="28" font-size="10" font-weight="700" fill="#7194bf" class="mono" transform="translate(412,0)">VELOCITY</text>
        <text x="20" y="74" font-size="44" font-weight="900" fill="#ff3366" transform="translate(412,0)">60<tspan font-size="24">FPS</tspan></text>
        <text x="20" y="94" font-size="10" font-weight="600" fill="#4d6f99" class="mono" transform="translate(412,0)">HIGH-OCTANE BUILDS</text>
      </g>

      <!-- Language / Core Focus Breakdown Bars -->
      <g transform="translate(0, 220)">
        <text x="0" y="16" font-size="11" font-weight="700" fill="#7d95b7" class="mono" letter-spacing="1.6">
          PRIMARY ENGINEERING DISCIPLINES
        </text>

        <!-- Bar 1: JavaScript & Creative Web -->
        <g transform="translate(0, 32)">
          <text x="0" y="14" font-size="12" font-weight="700" fill="#f0f5ff" class="mono">JavaScript &amp; 3D WebGL (Three.js)</text>
          <text x="560" y="14" font-size="13" font-weight="800" fill="#00f0ff" class="mono" text-anchor="end">40%</text>
          <rect x="0" y="22" width="560" height="10" rx="5" fill="#10233e" />
          <rect x="0" y="22" width="224" height="10" rx="5" fill="#00f0ff">
            <animate attributeName="width" from="0" to="224" dur="1.8s" fill="freeze" />
          </rect>
        </g>

        <!-- Bar 2: Dart & Flutter Mobile -->
        <g transform="translate(0, 80)">
          <text x="0" y="14" font-size="12" font-weight="700" fill="#f0f5ff" class="mono">Dart &amp; Flutter (Mobile Architecture)</text>
          <text x="560" y="14" font-size="13" font-weight="800" fill="#247bff" class="mono" text-anchor="end">30%</text>
          <rect x="0" y="22" width="560" height="10" rx="5" fill="#10233e" />
          <rect x="0" y="22" width="168" height="10" rx="5" fill="#247bff">
            <animate attributeName="width" from="0" to="168" dur="1.8s" fill="freeze" />
          </rect>
        </g>

        <!-- Bar 3: CSS3, Micro-Animations & UI Precision -->
        <g transform="translate(0, 128)">
          <text x="0" y="14" font-size="12" font-weight="700" fill="#f0f5ff" class="mono">CSS3, Micro-Animations &amp; Dark UI</text>
          <text x="560" y="14" font-size="13" font-weight="800" fill="#ff3366" class="mono" text-anchor="end">20%</text>
          <rect x="0" y="22" width="560" height="10" rx="5" fill="#10233e" />
          <rect x="0" y="22" width="112" height="10" rx="5" fill="#ff3366">
            <animate attributeName="width" from="0" to="112" dur="1.8s" fill="freeze" />
          </rect>
        </g>

        <!-- Bar 4: Backend Node.js & APIs -->
        <g transform="translate(0, 176)">
          <text x="0" y="14" font-size="12" font-weight="700" fill="#f0f5ff" class="mono">Backend, REST APIs &amp; DevOps</text>
          <text x="560" y="14" font-size="13" font-weight="800" fill="#54c5f8" class="mono" text-anchor="end">10%</text>
          <rect x="0" y="22" width="560" height="10" rx="5" fill="#10233e" />
          <rect x="0" y="22" width="56" height="10" rx="5" fill="#54c5f8">
            <animate attributeName="width" from="0" to="56" dur="1.8s" fill="freeze" />
          </rect>
        </g>
